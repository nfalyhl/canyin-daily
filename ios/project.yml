name: CanyinDaily
options:
  bundleIdPrefix: com.canyindaily
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

targets:
  CanyinDaily:
    type: application
    platform: iOS
    sources:
      # www 作为「文件夹引用」打进包里，保持 www/index.html 这个目录结构
      - path: CanyinDaily
        excludes:
          - "www"
      - path: CanyinDaily/www
        type: folder
    settings:
      base:
        PRODUCT_NAME: CanyinDaily
        PRODUCT_BUNDLE_IDENTIFIER: com.canyindaily.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: CanyinDaily/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
schemes:
  CanyinDaily:
    build:
      targets:
        CanyinDaily: all
    run:
      config: Release
    archive:
      config: Release
