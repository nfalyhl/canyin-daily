<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>餐饮日报</title>
<meta name="description" content="每天一分钟，读完餐饮行业的产品上新、行业趋势与品牌动作。">
<meta name="theme-color" content="#f2f3f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="餐饮日报">
<meta name="mobile-web-app-capable" content="yes">



<style>
/* ==========================================================================
   餐饮日报 · 出餐票据风格
   配色分「白班 / 夜班」两套：白班是门店白纸，夜班是后厨显示屏。
   三个板块各有自己的工位色，卡片是按重要度排的票据。
   ========================================================================== */

:root {
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC",
          "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono",
          "Cascadia Mono", Consolas, "Liberation Mono", monospace;

  --bg: #f2f3f1;
  --surface: #ffffff;
  --surface-2: #f7f8f6;
  --ink: #14171b;
  --ink-2: #5a616a;
  --ink-3: #8d949c;
  --line: #dfe1de;
  --line-2: #ebeceA;
  --line-dash: #d2d6d1;
  --shadow: 0 1px 2px rgba(20, 23, 27, .05);

  --c-product: #d8432f;
  --c-trend: #1b5fc1;
  --c-brand: #b4740b;

  --head-h: 76px;
  --page-w: 680px;
}

html[data-shift="night"] {
  --bg: #0e1114;
  --surface: #171b21;
  --surface-2: #1c2128;
  --ink: #eceef1;
  --ink-2: #9aa1aa;
  --ink-3: #6c747d;
  --line: #262c34;
  --line-2: #1f252c;
  --line-dash: #333a44;
  --shadow: none;
  --c-product: #ff6a55;
  --c-trend: #5ba8ff;
  --c-brand: #f0ae38;
  color-scheme: dark;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

html, body { overflow-x: hidden; max-width: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "tnum" 0;
}

.mono { font-family: var(--mono); font-feature-settings: "tnum" 1; }
a { color: inherit; }
code { font-family: var(--mono); font-size: .92em; }

:focus-visible {
  outline: 2px solid var(--c-trend);
  outline-offset: 2px;
  border-radius: 3px;
}

/* ---------------------------------------------------------------- 报头 --- */
.masthead {
  position: sticky;
  top: 0;
  z-index: 10;
  padding: calc(9px + env(safe-area-inset-top)) 16px 7px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(1.5) blur(10px);
  -webkit-backdrop-filter: saturate(1.5) blur(10px);
  border-bottom: 1px solid var(--line-2);
}

.masthead__bar {
  display: flex;
  align-items: center;
  height: 32px;
  max-width: var(--page-w);
  margin: 0 auto;
}

.wordmark { display: flex; align-items: baseline; }
.wordmark__cn { font-size: 19px; font-weight: 800; letter-spacing: .055em; }
.wordmark__en {
  margin-left: 9px;
  padding-left: 9px;
  border-left: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: .2em;
  color: var(--ink-3);
}

.masthead__tools { margin-left: auto; display: flex; gap: 6px; }

.ghost {
  font: inherit;
  font-size: 12px;
  color: var(--ink-2);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 100px;
  padding: 4px 11px;
  cursor: pointer;
}
.ghost:hover { color: var(--ink); border-color: var(--ink-3); }

.masthead__meta {
  display: flex;
  align-items: center;
  gap: 8px;
  max-width: var(--page-w);
  margin: 5px auto 0;
  font-size: 11.5px;
  color: var(--ink-3);
  white-space: nowrap;
  overflow: hidden;
}
.masthead__meta .sep { width: 3px; height: 3px; border-radius: 50%; background: var(--line); }

/* ---------------------------------------------------------------- 主体 --- */
.page {
  max-width: var(--page-w);
  margin: 0 auto;
  padding: 0 16px;
}

/* 今日要点 ------------------------------------------------------------- */
.brief {
  position: relative;
  margin-top: 16px;
  padding: 15px 16px 13px;
  background: var(--surface);
  border: 1px solid var(--line-2);
  border-radius: 6px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
/* 三色出餐条：正好对应三个板块 */
.brief::before {
  content: "";
  position: absolute;
  inset: 0 0 auto 0;
  height: 3px;
  background: linear-gradient(90deg,
      var(--c-product) 0 33.34%, var(--c-trend) 33.34% 66.67%, var(--c-brand) 66.67% 100%);
}

.sec-head {
  display: flex;
  align-items: center;
  gap: 7px;
  margin: 4px 0 0;
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: .06em;
  color: var(--ink-2);
}
.sec-head__tick { width: 3px; height: 12px; background: var(--ink-3); }
.sec-head__note { margin-left: auto; font-weight: 400; font-size: 11px; color: var(--ink-3); font-family: var(--mono); }

.brief__list { list-style: none; margin: 13px 0 0; padding: 0; display: grid; gap: 11px; }

.brief__item { display: grid; grid-template-columns: auto 1fr; gap: 10px; }
.brief__no {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-3);
  padding-top: 4px;
}
.brief__cat {
  display: block;
  margin-bottom: 2px;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .04em;
  color: var(--c);
}
.brief__text { margin: 0; font-size: 14.5px; line-height: 1.62; font-weight: 500; }

.brief__foot { display: flex; align-items: center; gap: 10px; margin-top: 14px; }

.solid {
  font: inherit;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--surface);
  background: var(--ink);
  border: 1px solid var(--ink);
  border-radius: 100px;
  padding: 5px 14px;
  cursor: pointer;
}
.solid:active { transform: translateY(1px); }
.hint { font-size: 11.5px; color: var(--ink-3); }

/* 高频词 --------------------------------------------------------------- */
.kw { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
.kw__label {
  flex: 0 0 auto;
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: .18em;
  color: var(--ink-3);
}
.kw__list {
  display: flex;
  gap: 6px;
  list-style: none;
  margin: 0;
  padding: 0 0 2px;
  overflow-x: auto;
  scrollbar-width: none;
}
.kw__list::-webkit-scrollbar { display: none; }
.kw__list li {
  flex: 0 0 auto;
  font-size: 11.5px;
  color: var(--ink-2);
  background: var(--surface-2);
  border: 1px solid var(--line-2);
  border-radius: 100px;
  padding: 3px 9px;
}

/* 筛选 ---------------------------------------------------------------- */
.filters {
  position: sticky;
  top: var(--head-h);
  z-index: 9;
  display: flex;
  gap: 6px;
  margin: 16px -16px 0;
  padding: 9px 16px;
  overflow-x: auto;
  scrollbar-width: none;
  background: var(--bg);
  border-bottom: 1px solid var(--line-2);
}
.filters::-webkit-scrollbar { display: none; }

.chip {
  flex: 0 0 auto;
  font: inherit;
  font-size: 12.5px;
  color: var(--ink-2);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 100px;
  padding: 5px 12px;
  cursor: pointer;
  transition: color .15s, border-color .15s;
}
.chip b { font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--ink-3); margin-left: 4px; }
.chip.is-on { color: var(--c, var(--ink)); border-color: var(--c, var(--ink)); }
.chip.is-on b { color: var(--c, var(--ink)); opacity: .75; }

/* 票据列表 ------------------------------------------------------------- */
.feed { display: grid; gap: 10px; margin-top: 12px; }

.group-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 14px 0 0;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .04em;
  color: var(--c);
}
.group-head b { font-family: var(--mono); font-size: 11px; color: var(--ink-3); font-weight: 600; }
.group-head::after { content: ""; flex: 1; height: 1px; background: var(--line-2); }

.ticket {
  position: relative;
  display: block;
  padding: 13px 14px 0 20px;
  background: var(--surface);
  border: 1px solid var(--line-2);
  border-radius: 6px;
  box-shadow: var(--shadow);
  text-decoration: none;
  color: inherit;
}
.ticket__rail {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
  border-radius: 6px 0 0 6px;
  background: var(--c);
}
.ticket__head { display: flex; align-items: center; gap: 9px; font-size: 11px; }
.ticket__no { font-family: var(--mono); font-weight: 700; color: var(--ink-3); letter-spacing: .04em; }
.ticket__cat { font-size: 11.5px; font-weight: 700; color: var(--c); letter-spacing: .02em; }
.ticket__time { margin-left: auto; font-family: var(--mono); color: var(--ink-3); }
.ticket__title {
  margin: 7px 0 0;
  font-size: 16px;
  line-height: 1.45;
  font-weight: 700;
  letter-spacing: .005em;
}
.ticket__sum { margin: 6px 0 0; font-size: 13.5px; line-height: 1.7; color: var(--ink-2); }

/* 虚线撕口：两侧各咬掉一个半圆，像后厨票据 */
.perf {
  position: relative;
  margin: 13px -14px 0 -20px;
  border-top: 1px dashed var(--line-dash);
  height: 0;
}
.perf::before, .perf::after {
  content: "";
  position: absolute;
  top: -8.5px;
  width: 17px;
  height: 17px;
  border-radius: 50%;
  background: var(--bg);
}
.perf::before { left: -8.5px; }
.perf::after { right: -8.5px; }

.ticket__foot {
  display: flex;
  align-items: center;
  margin: 0 -14px;
  padding: 9px 14px 10px 20px;
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--ink-3);
}
.ticket__tags { display: flex; gap: 6px; overflow: hidden; }
.ticket__tags span { color: var(--ink-3); }
.ticket__go { margin-left: auto; color: var(--c); font-weight: 700; letter-spacing: .02em; }

.ticket:hover { border-color: var(--line); }
.ticket:active { background: var(--surface-2); }

/* 空状态 / 页脚 -------------------------------------------------------- */
.nothing { margin: 40px 0; text-align: center; color: var(--ink-2); }
.nothing__hint { font-size: 12.5px; color: var(--ink-3); }

.foot {
  max-width: var(--page-w);
  margin: 30px auto 0;
  padding: 16px 16px calc(34px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--line);
  font-size: 11.5px;
  line-height: 1.75;
  color: var(--ink-3);
}
.foot__row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.foot__row span {
  font-family: var(--mono);
  font-size: 10.5px;
  border: 1px solid var(--line-2);
  border-radius: 3px;
  padding: 2px 6px;
}
.foot__note { margin: 0; }

/* 往期抽屉 ------------------------------------------------------------- */
.sheet {
  width: 100%;
  max-width: var(--page-w);
  margin: auto auto 0;
  padding: 0;
  border: none;
  border-radius: 12px 12px 0 0;
  background: var(--surface);
  color: var(--ink);
}
.sheet::backdrop { background: rgba(8, 10, 13, .48); }
.sheet__bar {
  display: flex;
  align-items: center;
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--line-2);
  font-size: 14px;
}
.sheet__bar .ghost { margin-left: auto; }
.sheet__list { list-style: none; margin: 0; padding: 6px 0 calc(18px + env(safe-area-inset-bottom)); max-height: 58vh; overflow-y: auto; }
.sheet__list li {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 11px 16px;
  border-bottom: 1px solid var(--line-2);
  font-size: 13.5px;
  color: var(--ink-2);
  cursor: pointer;
}
.sheet__list li[aria-current="true"] { color: var(--ink); font-weight: 700; }
.sheet__list .d { font-family: var(--mono); font-size: 12.5px; color: var(--ink); }
.sheet__list .t { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--ink-3); }

/* 入场动效 ------------------------------------------------------------- */
@keyframes rise {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}
.reveal { animation: rise .36s cubic-bezier(.2, .7, .3, 1) both; }

@media (prefers-reduced-motion: reduce) {
  .reveal { animation: none; }
  .chip { transition: none; }
}

@media (min-width: 720px) {
  .masthead { padding-left: 24px; padding-right: 24px; }
  .page { padding: 0 24px; }
  .filters { margin-left: -24px; margin-right: -24px; padding-left: 24px; padding-right: 24px; }
  .ticket__title { font-size: 16.5px; }
}

</style>
</head>
<body>

<header class="masthead">
  <div class="masthead__bar">
    <div class="wordmark">
      <span class="wordmark__cn">餐饮日报</span>
      <span class="wordmark__en">DAILY&nbsp;PASS</span>
    </div>
    <div class="masthead__tools">
      <button type="button" class="ghost" id="archiveBtn">往期</button>
      <button type="button" class="ghost" id="shiftBtn" aria-live="polite">夜班</button>
    </div>
  </div>
  <div class="masthead__meta">
    <span id="issueNo" class="mono">第 001 期</span>
    <span class="sep"></span>
    <span id="dateLine">—</span>
    <span class="sep"></span>
    <span id="genLine" class="mono">—</span>
  </div>
</header>

<main class="page">

  <section class="brief" aria-labelledby="briefHead">
    <h2 class="sec-head" id="briefHead">
      <span class="sec-head__tick"></span>今日要点
      <span class="sec-head__note" id="briefNote"></span>
    </h2>
    <ol class="brief__list" id="briefList"></ol>
    <div class="brief__foot">
      <button type="button" class="solid" id="copyBtn">复制要点</button>
      <span class="hint" id="copyHint" role="status"></span>
    </div>
  </section>

  <section class="kw" aria-label="今日高频词">
    <span class="kw__label">今日高频</span>
    <ul class="kw__list" id="kwList"></ul>
  </section>

  <nav class="filters" id="filters" aria-label="按板块筛选"></nav>

  <section class="feed" id="feed" aria-live="polite"></section>

  <section class="nothing" id="nothing" hidden>
    <p id="nothingText">还没有采集到数据。</p>
    <p class="nothing__hint">在项目目录运行 <code>python daily.py</code> 生成今日日报。</p>
  </section>

</main>

<footer class="foot">
  <div class="foot__row" id="srcList"></div>
  <p class="foot__note">
    内容由公开信息源自动采集聚合，要点为原文摘录，版权归原作者所有；
    点击标题可跳转原文核对。本页由 <span class="mono">daily.py</span> 于
    <span id="footTime" class="mono">—</span> 生成。
  </p>
</footer>

<dialog class="sheet" id="archiveSheet">
  <div class="sheet__bar">
    <strong>往期日报</strong>
    <button type="button" class="ghost" id="sheetClose">关闭</button>
  </div>
  <ul class="sheet__list" id="archiveList"></ul>

(function () {
  'use strict';

  var CATS = [
    { id: 'product', label: '产品上新', color: 'var(--c-product)' },
    { id: 'trend', label: '行业趋势', color: 'var(--c-trend)' },
    { id: 'brand', label: '品牌动作', color: 'var(--c-brand)' }
  ];
  var CAT = {};
  CATS.forEach(function (c) { CAT[c.id] = c; });
  var SHIFT_KEY = 'canyin-shift';
  var WEEK = '日一二三四五六';

  var state = { digest: null, filter: 'all', history: [] };

  function $(sel) { return document.querySelector(sel); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function catOf(id) { return CAT[id] || { label: id || '动态', color: 'var(--ink-3)' }; }

  /* ------------------------------------------------------------ 班次主题 --- */
  function setShift(mode, persist) {
    document.documentElement.dataset.shift = mode;
    var btn = $('#shiftBtn');
    if (btn) btn.textContent = mode === 'night' ? '白班' : '夜班';
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', mode === 'night' ? '#0e1114' : '#f2f3f1');
    if (persist) { try { localStorage.setItem(SHIFT_KEY, mode); } catch (e) {} }
  }

  function initShift() {
    var forced = new URLSearchParams(location.search).get('shift');
    if (forced === 'day' || forced === 'night') {
      setShift(forced, false);
    } else {
      var saved = null;
      try { saved = localStorage.getItem(SHIFT_KEY); } catch (e) {}
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      setShift(saved || (mq.matches ? 'night' : 'day'), false);
      mq.addEventListener('change', function (e) {
        var cur = null;
        try { cur = localStorage.getItem(SHIFT_KEY); } catch (err) {}
        if (!cur) setShift(e.matches ? 'night' : 'day', false);
      });
    }
    $('#shiftBtn').addEventListener('click', function () {
      setShift(document.documentElement.dataset.shift === 'night' ? 'day' : 'night', true);
    });
  }

  /* ---------------------------------------------------------------- 工具 --- */
  function fmtDate(iso) {
    if (!iso) return '—';
    var p = iso.split('-');
    var d = new Date(iso + 'T00:00:00');
    return p[0] + '.' + p[1] + '.' + p[2] + ' 周' + WEEK[d.getDay()];
  }

  function hm(iso) { return iso ? iso.slice(11, 16) : ''; }

  function itemTime(it) {
    if (!it.published) return '';
    if (it.published.slice(0, 10) === state.digest.date) return hm(it.published);
    return it.published.slice(5, 10);
  }

  function syncHeadH() {
    var h = document.querySelector('.masthead').offsetHeight;
    document.documentElement.style.setProperty('--head-h', h + 'px');
  }

  /* -------------------------------------------------------------- 渲染 --- */
  function renderMasthead() {
    var d = state.digest;
    $('#issueNo').textContent = '第 ' + String(d.issue || 1).padStart(3, '0') + ' 期';
    $('#dateLine').textContent = fmtDate(d.date);
    $('#genLine').textContent = (hm(d.generated_at) || '—') + ' 生成';
    var t = $('#footTime');
    if (t) t.textContent = (d.generated_at || '').slice(0, 16).replace('T', ' ');
  }

  function renderBrief() {
    var list = $('#briefList');
    var brief = state.digest.brief || [];
    list.innerHTML = brief.map(function (b, i) {
      var c = catOf(b.cat);
      var catLine = b.cat
        ? '<span class="brief__cat">' + esc(c.label) + '</span>' : '';
      return '<li class="brief__item reveal" style="--c:' + c.color +
        ';animation-delay:' + (i * 40) + 'ms">' +
        '<span class="brief__no">' + String(i + 1).padStart(2, '0') + '</span>' +
        '<div>' + catLine + '<p class="brief__text">' + esc(b.text) + '</p></div></li>';
    }).join('');
    $('#briefNote').textContent = brief.length ? brief.length + ' 条' : '';
    if (!brief.length) {
      list.innerHTML = '<li class="brief__item"><span class="brief__no">—</span>' +
        '<div><p class="brief__text" style="color:var(--ink-3)">这一期还没有提炼出要点。</p></div></li>';
    }
  }

  function renderKeywords() {
    var kw = state.digest.keywords || [];
    var box = $('#kwList');
    box.innerHTML = kw.map(function (k) { return '<li>' + esc(k) + '</li>'; }).join('');
    $('#kwList').closest('.kw').hidden = kw.length === 0;
  }

  function renderFilters() {
    var d = state.digest;
    var chips = [{ id: 'all', label: '全部', n: d.total }];
    CATS.forEach(function (c) {
      chips.push({ id: c.id, label: c.label, n: (d.counts || {})[c.id] || 0, color: c.color });
    });
    $('#filters').innerHTML = chips.map(function (c) {
      return '<button type="button" class="chip' + (state.filter === c.id ? ' is-on' : '') +
        '" data-cat="' + c.id + '"' + (c.color ? ' style="--c:' + c.color + '"' : '') +
        (c.n ? '' : ' hidden') + '>' + esc(c.label) +
        ' <b>' + c.n + '</b></button>';
    }).join('');
    $('#filters').querySelectorAll('.chip').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.filter = btn.dataset.cat;
        renderFilters();
        renderFeed();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });
  }

  function ticketHTML(it, idx) {
    var c = catOf(it.cat);
    var tags = (it.tags || []).map(function (t) { return '#' + t; }).join(' ');
    return '<a class="ticket reveal" href="' + esc(it.url) + '" target="_blank" ' +
      'rel="noopener noreferrer" style="--c:' + c.color +
      ';animation-delay:' + Math.min(idx, 10) * 26 + 'ms">' +
      '<span class="ticket__rail"></span>' +
      '<div class="ticket__head">' +
      '<span class="ticket__no">' + String(it.no || idx + 1).padStart(2, '0') + '</span>' +
      '<span class="ticket__cat">' + esc(c.label) + '</span>' +
      '<span class="ticket__time">' + esc(itemTime(it)) + '</span>' +
      '</div>' +
      '<h3 class="ticket__title">' + esc(it.title) + '</h3>' +
      (it.summary ? '<p class="ticket__sum">' + esc(it.summary) + '</p>' : '') +
      '<div class="perf"></div>' +
      '<div class="ticket__foot">' +
      '<span>' + esc(it.source) + '</span>' +
      (tags ? '<span class="ticket__tags" style="margin-left:8px">' + esc(tags) + '</span>' : '') +
      '<span class="ticket__go">原文 ↗</span>' +
      '</div></a>';
  }

  function renderFeed() {
    var items = (state.digest.items || []).filter(function (it) {
      return state.filter === 'all' || it.cat === state.filter;
    });
    var html = '', lastCat = null, i = 0;
    items.forEach(function (it) {
      if (state.filter === 'all' && it.cat !== lastCat) {
        var c = catOf(it.cat);
        var n = items.filter(function (x) { return x.cat === it.cat; }).length;
        html += '<div class="group-head" style="--c:' + c.color + '">' + esc(c.label) +
          ' <b>' + n + '</b></div>';
        lastCat = it.cat;
      }
      html += ticketHTML(it, i++);
    });
    $('#feed').innerHTML = html;
    $('#nothing').hidden = items.length > 0;
    if (!items.length) {
      $('#nothingText').textContent = '这个板块今天没有条目。';
    }
  }

  function renderFooter() {
    var seen = {}, names = [];
    (state.digest.items || []).forEach(function (it) {
      if (it.source && !seen[it.source]) { seen[it.source] = 1; names.push(it.source); }
    });
    $('#srcList').innerHTML = names.map(function (n) {
      return '<span>' + esc(n) + '</span>';
    }).join('');
  }

  function renderAll() {
    renderMasthead();
    renderBrief();
    renderKeywords();
    renderFilters();
    renderFeed();
    renderFooter();
    syncHeadH();
  }

  /* ------------------------------------------------------ 复制今日要点 --- */
  function briefText() {
    var d = state.digest;
    var lines = ['餐饮日报 · ' + fmtDate(d.date) + '（第 ' + String(d.issue || 1) + ' 期）', ''];
    (d.brief || []).forEach(function (b, i) {
      var pre = b.cat ? '[' + catOf(b.cat).label + '] ' : '';
      lines.push((i + 1) + '. ' + pre + b.text);
    });
    if (d.keywords && d.keywords.length) {
      lines.push('', '今日高频：' + d.keywords.join(' / '));
    }
    lines.push('', '（共 ' + d.total + ' 条 · 由餐饮日报自动采集）');
    return lines.join('\n');
  }

  function legacyCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function initCopy() {
    var hint = $('#copyHint');
    $('#copyBtn').addEventListener('click', function () {
      var text = briefText();
      function done(ok) {
        hint.textContent = ok ? '已复制，可直接粘贴到群里' : '复制失败，请长按选中文字';
        setTimeout(function () { hint.textContent = ''; }, 2600);
      }
      if (navigator.clipboard && location.protocol !== 'file:') {
        navigator.clipboard.writeText(text).then(function () { done(true); },
          function () { done(legacyCopy(text)); });
      } else {
        done(legacyCopy(text));
      }
    });
  }

  /* ---------------------------------------------------------- 往期抽屉 --- */
  function renderArchive(list, current) {
    $('#archiveList').innerHTML = list.map(function (h) {
      return '<li data-date="' + esc(h.date) + '"' +
        (h.date === current ? ' aria-current="true"' : '') + '>' +
        '<span class="d">' + esc(h.date) + '</span>' +
        '<span class="t">' + (h.total || 0) + ' 条</span></li>';
    }).join('');
    $('#archiveList').querySelectorAll('li').forEach(function (li) {
      li.addEventListener('click', function () { loadDate(li.dataset.date); });
    });
  }

  async function loadDate(date) {
    if (date === state.digest.date) { $('#archiveSheet').close(); return; }
    if (location.protocol === 'file:') return;
    try {
      var r = await fetch('data/digest-' + date + '.json', { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      var d = await r.json();
      if (!d || !d.items) throw new Error('数据不完整');
      state.digest = d;
      state.filter = 'all';
      renderAll();
      $('#archiveSheet').close();
      window.scrollTo({ top: 0 });
    } catch (e) {
      alert('打开这一期失败：' + e.message);
    }
  }

  async function initArchive() {
    var sheet = $('#archiveSheet');
    $('#archiveBtn').addEventListener('click', async function () {
      if (!state.history.length && location.protocol !== 'file:') {
        try {
          var r = await fetch('data/index.json', { cache: 'no-store' });
          if (r.ok) {
            var idx = await r.json();
            state.history = idx.history || [];
          }
        } catch (e) {}
      }
      if (!state.history.length) {
        state.history = [{ date: state.digest.date, total: state.digest.total }];
      }
      renderArchive(state.history, state.digest.date);
      sheet.showModal();
    });
    $('#sheetClose').addEventListener('click', function () { sheet.close(); });
    sheet.addEventListener('click', function (e) { if (e.target === sheet) sheet.close(); });
  }

  /* ------------------------------------------------ http 打开时取最新数据 --- */
  async function refreshFromServer() {
    if (location.protocol === 'file:') return;
    try {
      var r = await fetch('data/index.json', { cache: 'no-store' });
      if (!r.ok) return;
      var idx = await r.json();
      state.history = idx.history || [];
      if (!idx.latest || idx.latest === state.digest.date) return;
      var r2 = await fetch('data/digest-' + idx.latest + '.json', { cache: 'no-store' });
      if (!r2.ok) return;
      var d = await r2.json();
      if (d && d.items) { state.digest = d; renderAll(); }
    } catch (e) {}
  }

  /* ---------------------------------------------------------------- 启动 --- */
  function boot() {
    var el = document.getElementById('boot-data');
    var data = null;
    try { data = JSON.parse(el.textContent); } catch (e) { data = null; }

    initShift();
    initCopy();

    if (!data || !data.items || !data.items.length) {
      state.digest = { date: '', generated_at: '', issue: 1, total: 0, counts: {},
        keywords: [], brief: [], items: [] };
      renderMasthead();
      $('#briefList').innerHTML = '';
      $('#filters').innerHTML = '';
      $('#kwList').closest('.kw').hidden = true;
      $('#nothing').hidden = false;
      $('#nothingText').textContent = '还没有今天的日报数据。';
      syncHeadH();
      return;
    }

    state.digest = data;
    renderAll();
    initArchive();
    syncHeadH();
    refreshFromServer();

    window.addEventListener('resize', syncHeadH);
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();

</script>
</body>
</html>
