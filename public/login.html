<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 餐饮日报</title>
<meta name="theme-color" content="#eef0ee">
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #eef0ee; --surface: #fff; --ink: #14171b; --ink-2: #5a616a; --ink-3: #8a9199;
    --line: #dcdfdb; --line-2: #e8eae6; --c-product: #d8432f; --c-trend: #1b5fc1; --c-brand: #b4740b;
    --font: -apple-system, "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  }
  html[data-shift="night"] {
    --bg: #0d1013; --surface: #171b21; --ink: #eceef1; --ink-2: #9aa1aa; --ink-3: #6d757e;
    --line: #262c34; --line-2: #1e242b; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--ink); font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }
  .strip { position: fixed; inset: 0 0 auto 0; height: 3px;
    background: linear-gradient(90deg, var(--c-product) 0 33.34%, var(--c-trend) 33.34% 66.67%, var(--c-brand) 66.67% 100%); }
  .card {
    width: min(380px, calc(100vw - 40px)); background: var(--surface);
    border: 1px solid var(--line-2); border-radius: 8px; padding: 30px 30px 26px;
    box-shadow: 0 1px 2px rgba(20,23,27,.06);
  }
  .brand { display: flex; align-items: baseline; gap: 9px; margin-bottom: 4px; }
  .brand b { font-size: 24px; font-weight: 800; letter-spacing: .05em; }
  .brand span { font-family: var(--mono); font-size: 9.5px; letter-spacing: .2em; color: var(--ink-3);
    padding-left: 9px; border-left: 1px solid var(--line); }
  .sub { margin: 0 0 22px; font-size: 12.5px; color: var(--ink-3); }
  label { display: block; font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em;
    color: var(--ink-3); margin: 14px 0 6px; text-transform: uppercase; }
  input {
    width: 100%; padding: 10px 12px; font: inherit; font-size: 14.5px;
    color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 5px;
  }
  input:focus { outline: 2px solid var(--c-trend); outline-offset: 1px; border-color: transparent; }
  button {
    width: 100%; margin-top: 22px; padding: 11px; font: inherit; font-size: 14.5px; font-weight: 600;
    color: var(--bg); background: var(--ink); border: 0; border-radius: 5px; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  .err { margin: 14px 0 0; font-size: 12.5px; color: var(--c-product); min-height: 18px; }
  .limit { margin-top: 16px; border-top: 1px dashed var(--line); padding-top: 14px; }
  .limit[hidden] { display: none; }
  .limit__hint { margin: 0 0 10px; font-size: 12px; color: var(--ink-2); line-height: 1.7; }
  .limit__list { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
  .limit__item { display: flex; align-items: center; gap: 10px; padding: 9px 11px;
    background: var(--bg); border: 1px solid var(--line-2); border-radius: 6px; }
  .limit__item div { flex: 1; min-width: 0; }
  .limit__item b { display: block; font-size: 13px; }
  .limit__item span { font-size: 11px; color: var(--ink-3); }
  .limit__item button { width: auto; margin: 0; padding: 6px 10px; font-size: 12px; font-weight: 600; }
  .foot { margin: 18px 0 0; font-size: 11.5px; color: var(--ink-3); line-height: 1.7; }
</style>
</head>
<body>
<div class="strip"></div>

<form class="card" id="form" autocomplete="on">
  <div class="brand"><b>餐饮日报</b><span>DAILY&nbsp;PASS</span></div>
  <p class="sub">内网 / 外网双板块 · 每日餐饮行业情报</p>

  <label for="u">用户名</label>
  <input id="u" name="username" type="text" autocomplete="username" autocapitalize="none"
         autocorrect="off" spellcheck="false" required>

  <label for="p">密码</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>

  <button type="submit" id="btn">登录</button>
  <p class="err" id="err" role="alert"></p>
  <div class="limit" id="limit" hidden>
    <p class="limit__hint">该账号的设备名额已满（上限 <b id="limitMax">3</b> 台）。
      选一台下线，就能在本机登录：</p>
    <ul class="limit__list" id="limitList"></ul>
  </div>
  <p class="foot">没有账号请让管理员执行
    <span style="font-family:var(--mono)">python tools\setup_users.py --add 用户名 密码</span> 添加。</p>
</form>

<script>
(function () {
  var theme = localStorage.getItem('canyin-shift');
  if (!theme) theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day';
  document.documentElement.dataset.shift = theme;

  var form = document.getElementById('form');
  var err = document.getElementById('err');
  var btn = document.getElementById('btn');
  var limitBox = document.getElementById('limit');
  var limitList = document.getElementById('limitList');
  var DEV_KEY = 'canyin-device-id';

  // 设备身份：和 auth.js 用同一个 localStorage 键，保证前后台认的是同一台设备
  function deviceId() {
    var id = '';
    try { id = localStorage.getItem(DEV_KEY) || ''; } catch (e) {}
    if (!id || id.length < 6) {
      try {
        id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
          : 'dev-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
        localStorage.setItem(DEV_KEY, id);
      } catch (e) {}
    }
    return id;
  }

  function deviceName() {
    var ua = navigator.userAgent || '';
    var os = /Windows/.test(ua) ? 'Windows' : /iPhone|iPad|iPod/.test(ua) ? 'iPhone/iPad'
      : /Android/.test(ua) ? 'Android' : /Macintosh/.test(ua) ? 'macOS'
      : /Linux/.test(ua) ? 'Linux' : '未知系统';
    var br = /Edg\//.test(ua) ? 'Edge' : /OPR\//.test(ua) ? 'Opera' : /Chrome\//.test(ua) ? 'Chrome'
      : /Firefox\//.test(ua) ? 'Firefox' : /Safari\//.test(ua) ? 'Safari' : '浏览器';
    return os + ' · ' + br;
  }

  // 已经登录过就直接进主页
  fetch('/api/session', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (s) { if (s && s.logged_in) location.replace('/index.html'); })
    .catch(function () {});

  function renderLimit(devices) {
    if (!devices || !devices.length) { limitBox.hidden = true; return; }
    limitBox.hidden = false;
    limitList.innerHTML = devices.map(function (d) {
      return '<li class="limit__item"><div><b>' + d.name + '</b>' +
        '<span>' + (d.last || '') + (d.ip ? ' · ' + d.ip : '') + '</span></div>' +
        '<button type="button" class="b" data-kick="' + d.id + '">下线并登录</button></li>';
    }).join('');
    Array.prototype.forEach.call(limitList.querySelectorAll('[data-kick]'), function (b) {
      b.addEventListener('click', function () { submit(b.getAttribute('data-kick')); });
    });
  }

  async function submit(kick) {
    err.textContent = '';
    btn.disabled = true;
    btn.textContent = '登录中…';
    try {
      var r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('u').value.trim(),
          password: document.getElementById('p').value,
          deviceId: deviceId(),
          deviceName: deviceName(),
          kick: kick || undefined
        })
      });
      var data = await r.json();
      if (data && data.code === 'device_limit') {
        document.getElementById('limitMax').textContent = data.maxDevices || 3;
        renderLimit(data.devices);
        throw new Error(data.error || '设备名额已满');
      }
      if (!r.ok || !data.ok) throw new Error(data.error || ('HTTP ' + r.status));
      btn.textContent = '登录成功，正在进入…';
      location.replace('/index.html');
    } catch (ex) {
      err.textContent = ex.message || '登录失败';
      btn.disabled = false;
      btn.textContent = '登录';
    }
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    submit(null);
  });
})();
</script>
</body>
</html>
